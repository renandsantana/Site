<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro VIP | Mega Absolutta</title>
  <style>
    /* Reset Geral */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #050505;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 0 15px 40px 15px;
      position: relative;
    }

    /* Imagem de Fundo Centralizada no Rosto */
    .bg-image {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      /* Substitua 'sua-foto-de-fundo.jpg' pelo nome exato da sua foto */
      background-image: linear-gradient(rgba(5, 5, 5, 0.75), rgba(5, 5, 5, 0.85)), url('jc4.png');
      background-size: cover;
      background-position: center 15%; /* Enquadra o topo/rosto da foto */
      background-repeat: no-repeat;
      z-index: 1;
    }

    /* Cartão do Formulário estilo 'Dark Glass' */
    .cadastro-container {
      position: relative;
      z-index: 10;
      max-width: 450px;
      width: 100%;
      padding: 30px 25px;
      background-color: rgba(10, 10, 10, 0.78); /* Fundo escuro e transparente refinado */
      border: 1px solid rgba(212, 175, 55, 0.7);
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.9);
      text-align: center;
      backdrop-filter: blur(10px); /* Desfoque de vidro muito sofisticado */
      margin-top: 45vh; /* Empurra o cartão para baixo no computador */
      margin-bottom: 30px;
    }

    .cadastro-container h1 {
      color: #D4AF37;
      font-size: 1.5rem;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .cadastro-container p {
      color: #e0e0e0;
      font-size: 0.88rem;
      margin-bottom: 22px;
      line-height: 1.4;
    }

    .form-group {
      text-align: left;
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      color: #D4AF37;
      margin-bottom: 6px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .form-group input {
      width: 100%;
      padding: 13px 15px;
      background-color: rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 8px;
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.3s ease;
    }

    .form-group input:focus {
      border-color: #D4AF37;
      background-color: rgba(0, 0, 0, 0.85);
      box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #D4AF37 0%, #AA7C11 100%);
      color: #000000;
      font-weight: bold;
      font-size: 0.95rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      margin-top: 10px;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
    }

    #mensagem-sucesso {
      display: none;
      padding: 15px;
      background-color: rgba(212, 175, 55, 0.1);
      border: 1px solid #D4AF37;
      border-radius: 8px;
      color: #ffffff;
    }

    #mensagem-sucesso h2 {
      color: #D4AF37;
      margin-bottom: 8px;
      font-size: 1.3rem;
    }

    /* 📱 OTIMIZAÇÃO EXCLUSIVA PARA CELULARES */
    @media (max-width: 600px) {
      .bg-image {
        /* Enquadra exatamente a parte superior (rosto) na tela do celular */
        background-position: center top; 
      }

      .cadastro-container {
        /* Deixa 55% da altura da tela livre no topo para o rosto aparecer sem bloqueios! */
        margin-top: 55vh; 
        padding: 22px 18px;
        border-radius: 14px;
      }

      .cadastro-container h1 {
        font-size: 1.3rem;
      }

      .cadastro-container p {
        font-size: 0.82rem;
      }
    }
  </style>
</head>
<body>

  <!-- Camada da Imagem de Fundo -->
  <div class="bg-image"></div>

  <!-- Iframe Oculto para envio das respostas -->
  <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;" onload="if(submitted){mostrarSucesso();}"></iframe>

  <!-- Cartão de Cadastro Posicionado no Mobile -->
  <main class="cadastro-container">
    <div id="conteudo-form">
      <h1>Membro VIP Mega Absolutta</h1>
      <p>Cadastre-se para garantir atendimento prioritário, novidades da linha Premium e acesso às nossas tecnologias.</p>

      <form action="https://docs.google.com/forms/d/e/1FAIpQLSdq2cf3v0FxtI4hSK7gmmA6NHPkGtZ3iuzoA7VMEceWfphQsQ/formResponse" method="POST" target="hidden_iframe" onsubmit="submitted=true;">
        
        <div class="form-group">
          <label for="nome">Nome Completo</label>
          <input type="text" id="nome" name="entry.1013084486" placeholder="Digite o seu nome completo" required>
        </div>

        <div class="form-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="entry.450429787" placeholder="seuemail@exemplo.com" required>
        </div>

        <div class="form-group">
          <label for="whatsapp">WhatsApp / Telefone</label>
          <input type="tel" id="whatsapp" name="entry.489848782" placeholder="(11) 99999-9999" required>
        </div>

        <button type="submit" class="btn-submit">Garantir Cadastro VIP</button>
      </form>
    </div>

    <!-- Mensagem de Confirmação -->
    <div id="mensagem-sucesso">
      <h2>✨ Cadastro Realizado com Sucesso!</h2>
      <p>Agradecemos a preferência. Em breve nossa equipe entrará em contato.</p>
      <a href="index.html" class="btn-submit" style="display: inline-block; text-decoration: none; margin-top: 15px; width: auto; padding: 10px 25px;">Voltar ao Site</a>
    </div>
  </main>

  <script>
    var submitted = false;

    function mostrarSucesso() {
      document.getElementById('conteudo-form').style.display = 'none';
      document.getElementById('mensagem-sucesso').style.display = 'block';
    }
  </script>

</body>
</html>
